[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latam-synth"
version = "0.2.0"
description = "Generador de datos sinteticos de comportamiento de ahorro financiero, calibrado con 506K registros reales de LatAm (2015-2024)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
parquet = ["pyarrow>=15"]
apify = ["apify>=2.0"]
dev = ["pytest>=8", "scipy>=1.11", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
latam-synth = "latam_synth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_synth"]
